/**/ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    sample_rate: 3
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false
    # Physical box test: preserve forward, reverse the mirrored left/right angles.
    inverted: true
    auto_reconnect: true
    isSingleChannel: true
    intensity_bit: 0
    intensity: false
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    range_max: 8.0
    range_min: 0.12
    frequency: 6.0
    # The LIMO chassis blocks rear beams. Keep raw missing readings visible;
    # limo_scan_adapter converts invalid bins to NaN on scan, preserving scan_raw.
    # Do not turn the blind sector into maximum-range free-space measurements.
    invalid_range_is_inf: false
    debug: false
