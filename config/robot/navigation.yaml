# Body and hard clearance come from navigation-footprint.json.
# Framework launch renders these placeholders into native Nav2 parameters.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: wheel/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: wheel/odom
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.10
      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.50
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.25
      max_angular_accel: 0.4
      use_rotate_to_heading: true
      allow_reversing: false
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.03
      regulated_linear_scaling_min_speed: 0.03
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "<robot_footprint>"
      footprint_padding: <robot_clearance>
      transform_tolerance: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /<robot_namespace>/scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: false
          obstacle_max_range: 7.5
          raytrace_max_range: 8.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "<robot_footprint>"
      footprint_padding: <robot_clearance>
      transform_tolerance: 0.3
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /<robot_namespace>/map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /<robot_namespace>/scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: false
          obstacle_max_range: 7.5
          raytrace_max_range: 8.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: false
      allow_unknown: true
smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.4
    enable_stamped_cmd_vel: false
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.10, 0.0, 0.25]
    min_velocity: [0.0, 0.0, -0.25]
    max_accel: [0.15, 0.0, 0.4]
    max_decel: [-0.3, 0.0, -0.6]
    odom_topic: wheel/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
    enable_stamped_cmd_vel: false
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_guarded
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false
    polygons: [StopZone]
    StopZone:
      type: polygon
      points: "<robot_stop_zone>"
      action_type: stop
      min_points: 2
      visualize: true
      polygon_pub_topic: stop_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan
      enabled: true
