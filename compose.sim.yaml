# Desktop simulation only: no chassis, serial ports, USB or hardware drivers.
name: limo-sim
services:
  ros:
    image: limo-jazzy-desktop-core:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_USER: ${DEV_USER:-blm}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    network_mode: host
    init: true
    runtime: nvidia
    environment:
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${LIMO_SIM_DOMAIN_ID:-73}
      ROS_AUTOMATIC_DISCOVERY_RANGE: SYSTEM_DEFAULT
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTDDS_DEFAULT_PROFILES_FILE: /workspace/config/networking/sim-fastdds.xml
      FASTRTPS_DEFAULT_PROFILES_FILE: /workspace/config/networking/sim-fastdds.xml
      DISPLAY: ${DISPLAY:-:1}
      XAUTHORITY: /tmp/sim.xauthority
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility,display
    volumes:
      - .:/workspace
      - ${LIMO_SIM_OUTPUT_DIR:-${HOME}/ai/outputs/limo-sim}:/sim-output
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/tmp/sim.xauthority:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: sleep infinity
