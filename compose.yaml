services:
  dev:
    container_name: limo_jazzy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_USER: ${DEV_USER}
        DEV_UID: ${DEV_UID}
        DEV_GID: ${DEV_GID}

    image: limo-jazzy-desktop-core:dev

    network_mode: host
    ipc: host
    runtime: nvidia

    group_add:
      - dialout

    environment:
      LIMO_ROS_NAMESPACE: ${LIMO_ROS_NAMESPACE:-}
      LIMO_SERIAL_PORT: ${LIMO_SERIAL_PORT:-/dev/ttylimo}
      LIMO_SERIAL_BAUD: ${LIMO_SERIAL_BAUD:-460800}
      LIMO_STARTUP_MODE: ${LIMO_STARTUP_MODE:-passive}

    devices:
      - ${LIMO_SERIAL_HOST_DEVICE:-/dev/ttyTHS1}:/dev/ttyTHS1
      - ${LIMO_SERIAL_HOST_DEVICE:-/dev/ttyTHS1}:${LIMO_SERIAL_PORT:-/dev/ttylimo}

    working_dir: /workspace

    volumes:
      - .:/workspace

    stdin_open: true
    tty: true
    init: true

    command: sleep infinity

  limo-base:
    extends:
      service: dev

    container_name: limo_base

    profiles:
      - robot

    environment:
      LIMO_STARTUP_MODE: ${LIMO_BASE_STARTUP_MODE:-commanded}

    stdin_open: false
    tty: false
    restart: "no"

    command:
      - ./scripts/run-limo-base.sh

  ydlidar:
    extends:
      service: dev

    container_name: limo_ydlidar

    profiles:
      - sensors

    environment:
      YDLIDAR_AVAILABLE: ${YDLIDAR_AVAILABLE:-false}
      YDLIDAR_CONTAINER_PATH: ${YDLIDAR_CONTAINER_PATH:-/dev/ydlidar}
      YDLIDAR_BAUD: ${YDLIDAR_BAUD:-115200}
      YDLIDAR_ROS_CONFIG: ${YDLIDAR_ROS_CONFIG:-}

    devices:
      - ${YDLIDAR_HOST_DEVICE:-/dev/null}:${YDLIDAR_CONTAINER_PATH:-/dev/ydlidar}

    stdin_open: false
    tty: false
    restart: "no"

    command:
      - ./scripts/run-ydlidar.sh

  realsense:
    extends:
      service: dev

    container_name: limo_realsense

    profiles:
      - sensors

    environment:
      REALSENSE_AVAILABLE: ${REALSENSE_AVAILABLE:-false}
      REALSENSE_SERIAL: ${REALSENSE_SERIAL:-}
      REALSENSE_ROS_CONFIG: ${REALSENSE_ROS_CONFIG:-}

    devices:
      - ${REALSENSE_USB_HOST_DEVICE:-/dev/null}:${REALSENSE_USB_CONTAINER_DEVICE:-/dev/bus/usb/000/000}

    group_add:
      - plugdev

    stdin_open: false
    tty: false
    restart: "no"

    command:
      - ./scripts/run-realsense.sh

  configurator:
    build:
      context: ./tools/configurator
      dockerfile: Dockerfile

    image: limo-configurator:dev

    working_dir: /workspace

    volumes:
      - .:/workspace:ro
      - /dev:/host/dev:ro
      - /etc/os-release:/host/etc/os-release:ro

    command:
      - check
      - --config
      - /workspace/config/config.yaml
      - --schema
      - /workspace/config/config.schema.json
      - --workspace
      - /workspace
      - --device-root
      - /host/dev

  robot-transforms:
    container_name: limo_robot_transforms
    extends:
      service: dev
    profiles: [robot]
    stdin_open: false
    tty: false
    restart: "no"
    command: [./scripts/ros2.sh, launch, /workspace/scripts/robot-transforms.launch.py]

  mapping:
    container_name: limo_mapping
    extends:
      service: dev
    profiles: [navigation]
    stdin_open: false
    tty: false
    restart: "no"
    command: [./scripts/run-navigation.sh, mapping]

  navigation:
    container_name: limo_navigation
    extends:
      service: dev
    profiles: [navigation]
    stdin_open: false
    tty: false
    restart: "no"
    environment:
      LIMO_CHECK_LIDAR_ORIENTATION: ${LIMO_CHECK_LIDAR_ORIENTATION:-true}
    command: [./scripts/run-navigation.sh, navigation]

  exploration:
    container_name: limo_exploration
    extends:
      service: dev
    profiles: [exploration]
    stdin_open: false
    tty: false
    restart: "no"
    command: [./scripts/run-navigation.sh, exploration]

  desktop:
    container_name: limo_desktop
    build:
      context: .
      dockerfile: Dockerfile.desktop
      args:
        DEV_USER: ${DEV_USER}
    image: limo-jazzy-desktop-core:desktop
    profiles: [desktop]
    network_mode: host
    ipc: host
    init: true
    restart: "no"
    working_dir: /workspace
    environment:
      LIMO_ROS_NAMESPACE: ${LIMO_ROS_NAMESPACE:-}
      DISPLAY: :1
      XAUTHORITY: /tmp/limo-desktop/Xauthority
      XDG_RUNTIME_DIR: /tmp/limo-desktop
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: "2"
    volumes:
      - .:/workspace
    command: [./scripts/run-desktop.sh]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          xdpyinfo >/dev/null 2>&1 &&
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/vnc.html', timeout=2)" &&
          pgrep -x rviz2 >/dev/null
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  vision:
    image: limo-jazzy-desktop-core:vision
    build:
      context: .
      dockerfile: Dockerfile.vision
      args:
        DEV_USER: ${DEV_USER}
    profiles: [vision]
    container_name: limo_vision
    network_mode: host
    ipc: host
    runtime: nvidia
    init: true
    restart: "no"
    working_dir: /workspace
    environment:
      LIMO_ROS_NAMESPACE: ${LIMO_ROS_NAMESPACE:-}
      LIMO_YOLO_MODEL: ${LIMO_YOLO_MODEL:-nano}
      LIMO_YOLO_DEVICE: ${LIMO_YOLO_DEVICE:-0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - .:/workspace:ro
    command: [./scripts/run-autonomy.sh, yolo]

  hide-and-seek:
    extends:
      service: vision
    container_name: limo_hide_and_seek
    profiles: [game]
    command: [./scripts/run-autonomy.sh, hide-and-seek]
