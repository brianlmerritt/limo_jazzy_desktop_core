services:
  dev:
    container_name: limo_jazzy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_USER: ${DEV_USER}
        DEV_UID: ${DEV_UID}
        DEV_GID: ${DEV_GID}

    image: limo-jazzy-desktop-core:dev

    network_mode: host
    ipc: host
    runtime: nvidia

    group_add:
      - dialout

    environment:
      LIMO_SERIAL_PORT: ${LIMO_SERIAL_PORT:-/dev/ttylimo}
      LIMO_SERIAL_BAUD: ${LIMO_SERIAL_BAUD:-460800}
      LIMO_STARTUP_MODE: ${LIMO_STARTUP_MODE:-passive}

    devices:
      - ${LIMO_SERIAL_HOST_DEVICE:-/dev/ttyTHS1}:/dev/ttyTHS1
      - ${LIMO_SERIAL_HOST_DEVICE:-/dev/ttyTHS1}:${LIMO_SERIAL_PORT:-/dev/ttylimo}

    working_dir: /workspace

    volumes:
      - .:/workspace

    stdin_open: true
    tty: true
    init: true

    command: sleep infinity

  limo-base:
    extends:
      service: dev

    container_name: limo_base

    profiles:
      - robot

    environment:
      LIMO_STARTUP_MODE: commanded

    stdin_open: false
    tty: false
    restart: "no"

    command:
      - ./scripts/run-limo-base.sh
      - commanded

  ydlidar:
    extends:
      service: dev

    container_name: limo_ydlidar

    profiles:
      - sensors

    environment:
      YDLIDAR_AVAILABLE: ${YDLIDAR_AVAILABLE:-false}
      YDLIDAR_CONTAINER_PATH: ${YDLIDAR_CONTAINER_PATH:-/dev/ydlidar}
      YDLIDAR_BAUD: ${YDLIDAR_BAUD:-115200}
      YDLIDAR_ROS_CONFIG: ${YDLIDAR_ROS_CONFIG:-}

    devices:
      - ${YDLIDAR_HOST_DEVICE:-/dev/null}:${YDLIDAR_CONTAINER_PATH:-/dev/ydlidar}

    stdin_open: false
    tty: false
    restart: "no"

    command:
      - ./scripts/run-ydlidar.sh

  realsense:
    extends:
      service: dev

    container_name: limo_realsense

    profiles:
      - sensors

    environment:
      REALSENSE_AVAILABLE: ${REALSENSE_AVAILABLE:-false}
      REALSENSE_SERIAL: ${REALSENSE_SERIAL:-}
      REALSENSE_ROS_CONFIG: ${REALSENSE_ROS_CONFIG:-}

    devices:
      - ${REALSENSE_USB_HOST_DEVICE:-/dev/null}:${REALSENSE_USB_CONTAINER_DEVICE:-/dev/bus/usb/000/000}

    group_add:
      - plugdev

    stdin_open: false
    tty: false
    restart: "no"

    command:
      - ./scripts/run-realsense.sh

  configurator:
    build:
      context: ./tools/configurator
      dockerfile: Dockerfile

    image: limo-configurator:dev

    working_dir: /workspace

    volumes:
      - .:/workspace:ro
      - /dev:/host/dev:ro
      - /etc/os-release:/host/etc/os-release:ro

    command:
      - check
      - --config
      - /workspace/config/config.yaml
      - --schema
      - /workspace/config/config.schema.json
      - --workspace
      - /workspace
      - --device-root
      - /host/dev
