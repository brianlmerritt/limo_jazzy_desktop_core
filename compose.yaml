services:
  dev:
    container_name: limo_humble
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_USER: ${DEV_USER}
        DEV_UID: ${DEV_UID}
        DEV_GID: ${DEV_GID}

    image: limo-humble-desktop-core:dev

    network_mode: host
    ipc: host
    runtime: nvidia

    group_add:
      - dialout

    environment:
      LIMO_SERIAL_PORT: ${LIMO_SERIAL_PORT:-/dev/ttylimo}
      LIMO_SERIAL_BAUD: ${LIMO_SERIAL_BAUD:-460800}
      LIMO_STARTUP_MODE: ${LIMO_STARTUP_MODE:-passive}

    devices:
      - ${LIMO_SERIAL_HOST_DEVICE:-/dev/ttyTHS1}:/dev/ttyTHS1
      - ${LIMO_SERIAL_HOST_DEVICE:-/dev/ttyTHS1}:${LIMO_SERIAL_PORT:-/dev/ttylimo}

    working_dir: /workspace

    volumes:
      - .:/workspace

    stdin_open: true
    tty: true
    init: true

    command: sleep infinity

  limo-base:
    extends:
      service: dev

    container_name: limo_base

    profiles:
      - robot

    environment:
      LIMO_STARTUP_MODE: commanded

    stdin_open: false
    tty: false
    restart: "no"

    command:
      - ./scripts/run-limo-base.sh
      - commanded

  configurator:
    build:
      context: ./tools/configurator
      dockerfile: Dockerfile

    image: limo-configurator:dev

    working_dir: /workspace

    volumes:
      - .:/workspace:ro
      - /dev:/host/dev:ro
      - /etc/os-release:/host/etc/os-release:ro

    command:
      - check
      - --config
      - /workspace/config/config.yaml
      - --schema
      - /workspace/config/config.schema.json
      - --workspace
      - /workspace
      - --device-root
      - /host/dev
